# One-off: point ghcr.io/reesmorris/opencut:latest back at the July 2025
# image so deployments using the old image name keep their old behaviour.
name: Restore Legacy Image Tag

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker buildx imagetools create \
            --tag ghcr.io/reesmorris/opencut:latest \
            ghcr.io/reesmorris/opencut@sha256:e53c33ba4d0b7deda4ad8875e91cece3af9c3820b56aba254973d7f44441f0e5
